<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FF6B35"/>
      <stop offset="100%" style="stop-color:#FF4500"/>
    </linearGradient>
    <linearGradient id="iconGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFFFFF"/>
      <stop offset="100%" style="stop-color:#F0F0F0"/>
    </linearGradient>
  </defs>
  
  <!-- Background circle -->
  <circle cx="256" cy="256" r="256" fill="url(#bgGradient)"/>
  
  <!-- Dumbbell icon -->
  <g transform="translate(256, 256) rotate(-30) translate(-256, -256)">
    <!-- Left weight -->
    <rect x="95" y="200" width="50" height="112" rx="10" fill="url(#iconGradient)"/>
    <rect x="115" y="185" width="30" height="142" rx="6" fill="url(#iconGradient)"/>
    
    <!-- Bar -->
    <rect x="145" y="246" width="222" height="20" rx="10" fill="url(#iconGradient)"/>
    
    <!-- Right weight -->
    <rect x="367" y="200" width="50" height="112" rx="10" fill="url(#iconGradient)"/>
    <rect x="367" y="185" width="30" height="142" rx="6" fill="url(#iconGradient)"/>
  </g>
  
  <!-- Accent line -->
  <circle cx="256" cy="256" r="200" fill="none" stroke="rgba(255,255,255,0.2)" stroke-width="8"/>
</svg>
