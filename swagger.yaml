  # ===== WORKOUT SESSION DRAFTS =====
  /api/workout-sessions/active:
    get:
      tags:
        - Workout Sessions
      summary: Recuperer la seance active
      description: Retourne la seance active ou brouillon de l'utilisateur, ou null si aucune seance n'est en cours.
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Seance active ou null
          content:
            application/json:
              schema:
                nullable: true
                oneOf:
                  - $ref: '#/components/schemas/WorkoutSessionDraft'
        '401':
          description: Non authentifie
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/workout-sessions/draft:
    post:
      tags:
        - Workout Sessions
      summary: Creer une seance brouillon
      description: Cree une seance active. programId et programDayId sont optionnels pour permettre une seance libre.
      security:
        - BearerAuth: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WorkoutSessionDraftCreate'
      responses:
        '201':
          description: Brouillon cree
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkoutSessionDraft'
        '409':
          description: Une seance active existe deja
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Programme introuvable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/workout-sessions/draft/{id}:
    patch:
      tags:
        - Workout Sessions
      summary: Sauvegarder progressivement une seance
      description: Accepte des updates partiels, met a jour lastSavedAt et incremente revision.
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WorkoutSessionDraftPatch'
      responses:
        '200':
          description: Brouillon sauvegarde
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkoutSessionDraft'
        '409':
          description: Conflit de revision
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Brouillon introuvable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    delete:
      tags:
        - Workout Sessions
      summary: Abandonner une seance en cours
      description: Passe le brouillon en status abandoned sans supprimer physiquement la ligne.
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Brouillon abandonne
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkoutSessionDraft'
        '404':
          description: Brouillon introuvable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/workout-sessions/draft/{id}/complete:
    post:
      tags:
        - Workout Sessions
      summary: Terminer une seance brouillon
      description: Passe le brouillon en finished et cree une seance dans l'historique workouts.
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: false
        content:
