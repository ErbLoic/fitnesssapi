          description: Nombre de résultats par page
        - name: userId
          in: query
          schema:
            type: string
            format: uuid
          description: Filtrer par ID d'utilisateur
      responses:
        '200':
          description: Liste des rapports d'erreur
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/ErrorReport'
                  pagination:
                    type: object
                    properties:
                      page:
                        type: integer
                      limit:
                        type: integer
                      total:
                        type: integer
                      totalPages:
                        type: integer
        '403':
          description: Accès refusé (admin uniquement)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Non authentifié
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /errors/{id}:
    get:
      tags:
        - Error Reports
      summary: Récupérer un rapport d'erreur
      description: Récupérer les détails d'un rapport d'erreur spécifique (admin uniquement)
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: ID du rapport d'erreur
      responses:
        '200':
          description: Détails du rapport d'erreur
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: '#/components/schemas/ErrorReport'
        '404':
          description: Rapport d'erreur non trouvé
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Accès refusé (admin uniquement)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Non authentifié
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    patch:
      tags:
        - Error Reports
      summary: Mettre a jour un rapport d'erreur
      description: Met a jour le statut, le workflow ou le responsable d'un rapport (admin uniquement)
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: ID du rapport d'erreur
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ErrorReportUpdateRequest'
      responses:
        '200':
          description: Rapport d'erreur mis a jour
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                  data:
                    $ref: '#/components/schemas/ErrorReport'
        '404':
          description: Rapport d'erreur non trouvé
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '400':
          description: Donnees invalides
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Accès refusé (admin uniquement)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Non authentifié
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

